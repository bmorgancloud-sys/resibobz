<!doctype html>
<html><head><meta charset="utf-8"><title>pdf render</title></head>
<body>
<script type="module">
  // Capture helper: renders page N of a PDF (base64) to a PNG data URL at the given dpi with pdf.js.
  import * as pdfjs from './node_modules/pdfjs-dist/legacy/build/pdf.min.mjs';
  pdfjs.GlobalWorkerOptions.workerSrc = './node_modules/pdfjs-dist/legacy/build/pdf.worker.min.mjs';
  window.renderPdf = async (b64, dpi = 300, pageNo = 1) => {
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const doc = await pdfjs.getDocument({ data: bytes }).promise;
    const page = await doc.getPage(pageNo);
    const vp = page.getViewport({ scale: dpi / 72 });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    return { png: canvas.toDataURL('image/png'), pages: doc.numPages, width: canvas.width, height: canvas.height };
  };
  window.pdfReady = true;
</script>
</body></html>
