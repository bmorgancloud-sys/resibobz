# Netlify: static hosting straight from the repo. No build step.
[build]
  publish = "."
  command = ""

# Security headers on every response. Netlify applies every matching [[headers]] rule, so these
# combine with the Cache-Control rules below. Everything the app loads is its own file: no inline
# scripts, no CDNs, no third parties (tests/browser/harness.js serves this same CSP to every test).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; worker-src 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Never cache the app shell or the service worker, so a deploy is picked up on the next load.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Everything else may be cached briefly. File names are not versioned, so keep this short:
# a browser without the service worker could otherwise mix a new index.html with old scripts.
# (sw.js installs with cache: 'reload', so this never feeds stale files into the offline cache.)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Vendored libraries and icons rarely change.
[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Install guide: /install shows install.html. The page, its CSS/JS, the how-to video and poster are
# not precached by sw.js (it lets them go to the network), and the page itself is never cached.
[[headers]]
  for = "/install.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/install"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/install"
  to = "/install.html"
  status = 200

# Dev-only pages (tests/stats.test.html, tests/seed.html) are never served in production.
[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true
